<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70">
<style>
  .p { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; fill:#22d3ee }
  .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:26px; font-weight:800; fill:#dbeafe }
  .s { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; fill:#7c93c3 }
  .track { stroke:#1b3466; stroke-width:2 }
  .fill { stroke:url(#line); stroke-width:2.5; stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.6s cubic-bezier(.6,0,.2,1) .2s forwards }
  .dot { fill:#22d3ee; animation:run 5s linear 1.8s infinite; opacity:0 }
  .t, .p { opacity:0; animation:in .7s ease-out forwards }
  @keyframes draw { to { stroke-dashoffset:0 } }
  @keyframes run { 0% { transform:translateX(0); opacity:0 } 5% { opacity:1 } 95% { opacity:1 } 100% { transform:translateX(1190px); opacity:0 } }
  @keyframes in { from { opacity:0; transform:translateX(-10px) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.01s !important; animation-iteration-count:1 !important } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040a18"/><stop offset="1" stop-color="#0a1d42"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#93c5fd" opacity=".07"/></pattern></defs>
<text class="p" x="4" y="36">~/about</text>
<text class="t" x="82" y="38">About me</text>
<text class="s" x="1196" y="36" text-anchor="end">who I am</text>
<line class="track" x1="4" y1="58" x2="1196" y2="58"/>
<line class="fill" x1="4" y1="58" x2="1196" y2="58"/>
<circle class="dot" cx="5" cy="58" r="4" filter="url(#glow)"/>
</svg>