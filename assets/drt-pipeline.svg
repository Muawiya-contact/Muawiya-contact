<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<style>
  .star { fill:#93c5fd; animation:tw 4s ease-in-out infinite }
  .wire { fill:none; stroke:#1b3466; stroke-width:2.5; stroke-dasharray:6 8; animation:flow 1s linear infinite }
  .node rect { fill:#081430; stroke:#1b3466 }
  .node text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size:17px; font-weight:600; fill:#dbeafe }
  .node .sub, .core .sub { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; font-weight:400; fill:#7c93c3 }
  .t { opacity:0; animation:in .6s ease-out forwards }
  .pk { fill:#60a5fa; filter:url(#glow) }
  .in { fill:#22d3ee }
  .led { fill:#13244a; animation:led 2s infinite }
  .ring { fill:none; stroke:url(#line); stroke-width:3; stroke-dasharray:30 14; transform-box:fill-box; transform-origin:center; animation:spin 4s linear infinite }
  .ring2 { fill:none; stroke:#3b82f6; stroke-width:1; opacity:.4; transform-box:fill-box; transform-origin:center; animation:pulse 2.4s ease-out infinite }
  .core text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-weight:800; font-size:24px; fill:#fff }
  .title { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; fill:#7c93c3; letter-spacing:2px }
  @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.8 } }
  @keyframes flow { to { stroke-dashoffset:-14 } }
  @keyframes in { from { opacity:0; transform:translateX(20px) } to { opacity:1; transform:none } }
  @keyframes led { 0%,60%,100% { fill:#13244a } 70% { fill:#22d3ee } }
  @keyframes spin { to { transform:rotate(360deg) } }
  @keyframes pulse { from { transform:scale(1); opacity:.5 } to { transform:scale(1.35); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.01s !important; animation-iteration-count:1 !important } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040a18"/><stop offset="1" stop-color="#0a1d42"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#93c5fd" opacity=".07"/></pattern></defs>
<rect width="1200" height="280" rx="18" fill="url(#bg)"/>
<rect width="1200" height="280" rx="18" fill="url(#dots)"/>
